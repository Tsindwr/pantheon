name: Publish Creosmark Pages

on:
  push:
    branches:
      - main
    paths:
      - "sunder-platform/apps/creosmark/**"
      - "sunder-platform/packages/core/**"
      - "sunder-platform/packages/experience-market/**"
      - "sunder-platform/packages/schema/**"
      - "sunder-platform/package.json"
      - "sunder-platform/pnpm-lock.yaml"
      - "sunder-platform/pnpm-workspace.yaml"
      - "sunder-platform/tsconfig*.json"
      - ".github/workflows/publish-creosmark-pages.yml"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if no relevant app files changed."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-creosmark-pages
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Creosmark changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}

    steps:
      - name: Detect relevant changes
        id: detect
        shell: bash
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$FORCE_PUBLISH" = "true" ]; then
            echo "Manual force publish requested."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE' > /tmp/creosmark-changed-files.txt
          const fs = require("node:fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const files = new Set();

          for (const commit of event.commits ?? []) {
            for (const key of ["added", "modified", "removed"]) {
              for (const file of commit[key] ?? []) {
                files.add(file);
              }
            }
          }

          for (const file of files) {
            console.log(file);
          }
          NODE

          cat /tmp/creosmark-changed-files.txt

          if [ "$EVENT_NAME" = "push" ] && [ ! -s /tmp/creosmark-changed-files.txt ]; then
            echo "No changed files were available in the push payload; publishing to avoid missing a Creosmark deploy."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHOULD_PUBLISH=false
          while IFS= read -r file; do
            case "$file" in
              sunder-platform/apps/creosmark/*|sunder-platform/packages/core/*|sunder-platform/packages/experience-market/*|sunder-platform/packages/schema/*|sunder-platform/package.json|sunder-platform/pnpm-lock.yaml|sunder-platform/pnpm-workspace.yaml|sunder-platform/tsconfig*.json|.github/workflows/publish-creosmark-pages.yml)
                SHOULD_PUBLISH=true
                break
                ;;
            esac
          done < /tmp/creosmark-changed-files.txt

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish Creosmark
    needs: changes
    if: needs.changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sunder-platform/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sunder-platform
        run: pnpm install --frozen-lockfile

      - name: Build Creosmark
        working-directory: sunder-platform
        run: pnpm --filter @sunderttrpg/creosmark build

      - name: Publish public GitHub Pages
        uses: ./.github/actions/publish-public-gh-pages
        with:
          app-name: creosmark
          publish-dir: sunder-platform/apps/creosmark/dist
          external-repository: Tsindwr/creosmark
          deploy-key: ${{ secrets.CREOSMARK_PAGES_DEPLOY_KEY }}
