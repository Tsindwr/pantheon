name: Publish Sunder Site Pages

on:
  push:
    branches:
      - main
    tags:
      - "site-v*.*.*"
    paths:
      - "sunder-platform/apps/site/**"
      - ".github/actions/publish-public-gh-pages/**"
      - ".github/workflows/publish-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site-pages
  cancel-in-progress: true

jobs:
  changes:
    name: Build and publish Sunder Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compute Sunder version
        id: version
        working-directory: sunder-platform/apps/site
        shell: bash
        run: |
          set -euo pipefail
          
          TAG=$(
            git describe \
                --tags \
                --match "site-v[0-9]*.[0-9]*.[0-9]*" \
                --abbrev=0
          )
          
          echo "Base site tag: ${TAG}"
          
          BASE=${TAG#site-v}
          
          IFS='.' read -r MAJOR MINOR BASE_PATCH <<< "$BASE"
          
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] \
            || ! [[ "$MINOR" =~ ^[0-9]+$ ]] \
            || ! [[ "$BASE_PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid Sunder site tag::Expected site-vMAJOR.MINOR.PATCH, got ${TAG}"
            exit 1
          fi
          
          # Only Sunder site source commits advance the patch version.
          PATCH_DELTA=$(
            git rev-list "${TAG}..HEAD" --count -- .
          )
          
          PATCH=$((BASE_PATCH + PATCH_DELTA))
          VERSION="${MAJOR}>${MINOR}.${PATCH}"
          
          echo "Base version: ${BASE}"
          echo "Site commits since tag: ${PATCH_DELTA}"
          echo "Computed Sunder version: ${VERSION}"
          
          sed -i \
            "s/^\(\s*sunder_version:\s*\).*/\1\"${VERSION}\"/" \
            mkdocs.yml
          
          grep "sunder_version:" mkdocs.yml
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_full=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${BASE}" >> "$GITHUB_OUTPUT"
          echo "tag_patch=${PATCH}" >> "GITHUB_OUTPUT"
          echo "tag_feature=v${MAJOR}.${MINOR}.0" >> "$GITHUB_OUTPUT"

      - name: Install MkDocs dependencies
        run: |
          set -euo pipefail
      
          python -m pip install --upgrade pip
          python -m pip install \
            mkdocs \
            mkdocs-material \
            pymdown-extensions \
            mkdocs-obsidian-support-plugin \
            mkdocs-roamlinks-plugin \
            pyyaml

      - name: Build chatbot knowledge bundle
        working-directory: sunder-platform/apps/site
        run: |
          set -euo pipefail
          python tools/chatbot/build_chatbot_index.py

      - name: Build MkDocs site
        working-directory: sunder-platform/apps/site
        run: |
          set -euo pipefail
          mkdocs build --clean

      - name: Validate GifHub Pages artifact
        working-directory: sunder-platform/apps/site
        shell: bash
        run: |
          set -euo pipefail
          
          if [ ! -f "site/index.html" ]; then
            echo "::error title=Missing site artifact::site/index.html was not generated."
            exit 1
          fi
          
          if [ ! -f "site/CNAME" ]; then
            echo "::error title=Missing custom domain::site/CNAME was not generated."
            exit 1
          fi
          
          DOMAIN=$(tr -d '\r\n' < site/CNAME)
          
          if [ "$DOMAIN" != "www.sunderttrpg.world" ]; then
            echo "::error title=Unexpected custom domain::Expected www.sunderttrpg.world but found '${DOMAIN}'."
            exit 1
          fi
          
          echo "Artifact validated."
          echo "Custom domain: ${DOMAIN}"

      - name: Publish public GitHub Pages
        uses: ./.github/actions/publish-public-gh-pages
        with:
          app-name: site
          publish-dir: sunder-platform/apps/site/site
          external-repository: Tsindwr/site
          deploy-key: ${{ secrets.SITE_PAGES_DEPLOY_KEY }}

      - name: Announce release notes
        uses: ./.github/actions/announce-release
        with:
          app-name: site
          notes-file: sunder-platform/apps/site/public/release-notes/${{ steps.version.outputs.tag_feature }}.json
          function-url: ${{ secrets.SUPABASE_RELEASE_FUNCTION_URL }}
          shared-secret: ${{ secrets.SUPABASE_POST_UPDATE_SECRET }}